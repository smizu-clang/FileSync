<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">FileSync — ファイル同期ツール</title>
  <desc id="description">透明感のあるパネルとフォルダー間の同期を描いた FileSync のサムネイル</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091426"/>
      <stop offset="0.52" stop-color="#142746"/>
      <stop offset="1" stop-color="#243d61"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1030 150) rotate(135) scale(600 430)">
      <stop stop-color="#69b9ff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#69b9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d8ebff" stop-opacity=".18"/>
      <stop offset=".52" stop-color="#87a9d8" stop-opacity=".09"/>
      <stop offset="1" stop-color="#d8ebff" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#93d7ff"/>
      <stop offset="1" stop-color="#658bff"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#b9e7ff"/>
      <stop offset="1" stop-color="#91aaff"/>
    </linearGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.8">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <circle cx="117" cy="571" r="220" fill="#5d8eff" opacity=".10"/>
  <circle cx="1180" cy="575" r="260" fill="#53d5ed" opacity=".08"/>

  <rect x="44" y="42" width="1192" height="556" rx="38" fill="url(#glass)" stroke="#d8e9ff" stroke-opacity=".28"/>
  <path d="M82 43h1118a38 38 0 0 1 38 38v12H44V81a38 38 0 0 1 38-38Z" fill="#fff" opacity=".035"/>

  <g font-family="Noto Sans JP, Yu Gothic, Hiragino Sans, sans-serif">
    <rect x="92" y="108" width="58" height="58" rx="18" fill="url(#folder)"/>
    <path d="M105 128h13l5 5h15v20h-33z" fill="#112745" opacity=".88"/>
    <path d="M106 126h12l5 5h14" fill="none" stroke="#e8f6ff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="168" y="149" fill="#f4f8ff" font-size="46" font-weight="700" letter-spacing="-.8">FileSync</text>
    <text x="94" y="245" fill="#f4f8ff" font-size="34" font-weight="600">ファイル同期を、シンプルに。</text>
    <text x="96" y="292" fill="#c0d2eb" font-size="20">フォルダー間の差分を確認して、安全に同期。</text>
    <text x="96" y="323" fill="#c0d2eb" font-size="20">Windows と Linux で使えるデスクトップアプリ。</text>

    <g transform="translate(96 382)">
      <rect width="158" height="42" rx="21" fill="#d9eaff" fill-opacity=".10" stroke="#d9eaff" stroke-opacity=".25"/>
      <circle cx="22" cy="21" r="5" fill="#8dd8ff"/>
      <text x="38" y="28" fill="#e4efff" font-size="15" font-weight="600">Windows 対応</text>
    </g>
    <g transform="translate(268 382)">
      <rect width="154" height="42" rx="21" fill="#d9eaff" fill-opacity=".10" stroke="#d9eaff" stroke-opacity=".25"/>
      <circle cx="22" cy="21" r="5" fill="#a6b8ff"/>
      <text x="38" y="28" fill="#e4efff" font-size="15" font-weight="600">双方向同期</text>
    </g>
    <text x="96" y="532" fill="#9db2d0" font-size="14" letter-spacing="1.2">TRANSPARENT UI  ·  PREVIEW BEFORE SYNC</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="665" y="127" width="505" height="389" rx="32" fill="#08172b" fill-opacity=".25" stroke="#e3f1ff" stroke-opacity=".30"/>
    <rect x="690" y="151" width="455" height="52" rx="16" fill="#eff7ff" fill-opacity=".08"/>
    <circle cx="715" cy="177" r="5" fill="#ff8585" opacity=".85"/>
    <circle cx="735" cy="177" r="5" fill="#ffd27e" opacity=".85"/>
    <circle cx="755" cy="177" r="5" fill="#8de4b2" opacity=".85"/>
    <text x="1097" y="183" text-anchor="end" fill="#c9d8ee" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="14">同期プレビュー</text>

    <rect x="704" y="235" width="180" height="188" rx="24" fill="#cfe5ff" fill-opacity=".10" stroke="#d8ebff" stroke-opacity=".26"/>
    <rect x="951" y="235" width="180" height="188" rx="24" fill="#cfe5ff" fill-opacity=".10" stroke="#d8ebff" stroke-opacity=".26"/>
    <path d="M744 281h36l13 13h62a10 10 0 0 1 10 10v68a12 12 0 0 1-12 12h-97a12 12 0 0 1-12-12z" fill="url(#folder)" fill-opacity=".94"/>
    <path d="M991 281h36l13 13h62a10 10 0 0 1 10 10v68a12 12 0 0 1-12 12h-97a12 12 0 0 1-12-12z" fill="url(#folder)" fill-opacity=".72"/>
    <path d="M750 302h107v67H750z" fill="#15345b" fill-opacity=".42"/>
    <path d="M997 302h107v67H997z" fill="#15345b" fill-opacity=".32"/>
    <g fill="#f5faff" fill-opacity=".8">
      <rect x="768" y="320" width="18" height="24" rx="4"/><rect x="795" y="320" width="18" height="24" rx="4"/><rect x="822" y="320" width="18" height="24" rx="4"/>
      <rect x="1015" y="320" width="18" height="24" rx="4"/><rect x="1042" y="320" width="18" height="24" rx="4"/><rect x="1069" y="320" width="18" height="24" rx="4"/>
    </g>
    <text x="794" y="401" text-anchor="middle" fill="#e7f1ff" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="15">更新元</text>
    <text x="1041" y="401" text-anchor="middle" fill="#e7f1ff" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="15">更新先</text>

    <path d="M891 306h52l-12-12m12 12-12 12M944 351h-52l12-12m-12 12 12 12" fill="none" stroke="url(#arrow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="918" cy="328" r="42" fill="#a4cbff" fill-opacity=".10" stroke="#d6e9ff" stroke-opacity=".22"/>
    <path d="M891 306h52l-12-12m12 12-12 12M944 351h-52l12-12m-12 12 12 12" fill="none" stroke="url(#arrow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="708" y="451" width="420" height="40" rx="13" fill="#b4d6ff" fill-opacity=".10"/>
    <circle cx="732" cy="471" r="5" fill="#88e6b4"/>
    <text x="750" y="477" fill="#d7e8fa" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="14">差分を確認してから実行</text>
    <text x="1108" y="477" text-anchor="end" fill="#a9c7ea" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="13">© 2026</text>
  </g>
</svg>
